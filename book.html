<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedEase - Book Appointment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz
,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <nav class="navbar">
    <div class="logo">MedEase</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="book.html">Book Appointment</a></li>
      <li><a href="departments.html">Departments</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  </nav>

  <div class="container">
    <h1>Book an Appointment</h1>
    <p class="subtitle">Fill in your details below</p>

    <form id="bookingForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 08012345678" required>

      <label for="department">Department</label>
      <select id="department" required>
        <option value="">-- Select Department --</option>
        <option value="General">General</option>
        <option value="Emergency">Emergency</option>
      </select>

      <label for="date">Preferred Date</label>
      <input type="date" id="date" required>

      <label for="time">Preferred Time</label>
      <input type="time" id="time" required>

      <button type="submit">Book Appointment</button>
    </form>

    <div id="confirmation" class="hidden">
      <h2>✅ Appointment Booked!</h2>
      <p id="confirmationText"></p>
    </div>
  </div>

 <script src="theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
